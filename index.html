<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Sofi ❤️</title>
    
    <!-- Cargando Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Pacifico (Título) y Rubik (Cuerpo y Botones) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Rubik', sans-serif;
            background-color: #fdf2f8; /* Fondo rosa pastel base */
            overflow: hidden;
            touch-action: manipulation;
            margin: 0;
            padding: 0;
        }

        /* Título romántico */
        .romantic-title {
            font-family: 'Pacifico', cursive;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.9), 6px 6px 16px rgba(0,0,0,0.4);
        }

        /* Canvas de corazones flotantes */
        #hearts-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        .btn-base {
            transition: all 0.2s ease-in-out;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2), 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .btn-base:active {
            transform: scale(0.95);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        }

        /* Animaciones para Modales */
        .modal-enter {
            animation: fadeIn 0.3s ease-out forwards;
        }
        .modal-content-enter {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        #no-btn {
            transition: top 0.3s ease, left 0.3s ease, transform 0.2s;
        }

        .fade-out {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease-out;
        }
    </style>
</head>
<body class="min-h-screen w-full flex items-center justify-center relative select-none">

    <!-- Canvas para los corazones flotantes con función seno -->
    <canvas id="hearts-canvas"></canvas>

    <!-- Contenedor Principal (Pantalla de inicio) -->
    <div id="main-screen" class="flex flex-col items-center justify-center p-6 w-full max-w-md z-10 transition-opacity duration-500">
        <h1 class="text-4xl sm:text-5xl md:text-6xl text-pink-500 text-center mb-12 leading-tight romantic-title">
            ¿Sofi es la chica más hermosa?
        </h1>
        
        <div class="flex flex-row justify-center items-center gap-6 w-full h-16 relative">
            <button id="yes-btn" class="btn-base bg-pink-400 hover:bg-pink-500 text-white font-bold py-3 px-6 rounded-full text-lg w-36 z-20">
                Sí, lo soy
            </button>
            <button id="no-btn" class="btn-base bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 px-6 rounded-full text-lg w-36 z-50">
                NO
            </button>
        </div>
    </div>

    <!-- Contenedor Final (Oculto al inicio) -->
    <div id="success-screen" class="hidden flex-col items-center justify-center p-6 absolute inset-0 z-10 bg-[#fdf2f8]/80 backdrop-blur-xs">
        <button id="close-success-btn" class="absolute top-4 right-4 text-pink-400 hover:text-pink-600 p-2 z-20 transition-transform active:scale-90 bg-white/60 rounded-full shadow-md">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>

        <!-- Imagen del gato blanco con ojos azul claro y corazón (Sin fondo sólido) -->
        <div class="w-64 h-64 sm:w-72 sm:h-72 mb-4 relative flex items-center justify-center">
            <img src="https://i.pinimg.com/originals/d5/81/b7/d581b739d86d933286d7670608d9ba33.gif" alt="Gato tierno con corazón" class="w-full h-full object-contain drop-shadow-2xl mix-blend-multiply filter contrast-105">
        </div>
        
        <h2 class="text-3xl sm:text-4xl font-bold text-pink-600 text-center px-4 romantic-title mt-2">¡Sabía que dirías que sí! ❤️</h2>
        <p class="mt-3 text-gray-700 text-center px-4 font-medium text-lg">Eres la niña más linda del universo entero.</p>
    </div>

    <!-- Modal 1: ¿Segura de tu respuesta? -->
    <div id="modal-1" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm modal-enter">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-[90%] shadow-2xl modal-content-enter flex flex-col items-center">
            <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">¿Segura de tu respuesta? 🤨</h2>
            <div class="flex flex-col w-full gap-4">
                <!-- Este botón se encogerá gradualmente -->
                <button id="confirm-btn" class="btn-base bg-red-400 hover:bg-red-500 text-white font-bold py-3 px-4 rounded-xl text-center w-full origin-center">
                    Confirmar
                </button>
                <button id="retract-btn" class="btn-base bg-green-400 hover:bg-green-500 text-white font-bold py-3 px-4 rounded-xl text-center w-full">
                    Retractarse
                </button>
            </div>
        </div>
    </div>

    <!-- Modal 2: Ya no tienes intentos -->
    <div id="modal-2" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm modal-enter">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-[90%] shadow-2xl modal-content-enter relative flex flex-col items-center text-center">
            <button id="close-modal-2" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 p-2">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
            <div class="text-5xl mb-4">🚫</div>
            <h2 class="text-2xl font-bold text-gray-800">Se agotaron tus intentos</h2>
            <p class="text-gray-600 mt-3 font-medium">Ya no tienes más intentos de darle al NO. Tu única opción es aceptar la verdad.</p>
        </div>
    </div>

    <script>
        // --- ANIMACIÓN DE FONDO CON CANVAS Y FUNCIÓN SENO ---
        const canvas = document.getElementById('hearts-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let hearts = [];

        // Tonos de rojo y rosado pastel
        const heartColors = ['#fca5a5', '#f87171', '#f472b6', '#fb7185', '#fda4af', '#f9a8d4', '#ec4899'];

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Heart {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.initialX = Math.random() * width;
                this.y = initial ? Math.random() * height : height + 50;
                this.size = Math.random() * 0.7 + 0.3; // Tamaños variados
                this.speed = Math.random() * 1.5 + 0.5; // Velocidad vertical
                this.color = heartColors[Math.floor(Math.random() * heartColors.length)];
                
                // Movimiento oscilatorio denotado por la función seno
                this.angle = Math.random() * Math.PI * 2;
                this.angleSpeed = Math.random() * 0.03 + 0.01;
                this.amplitude = Math.random() * 45 + 15;
                
                this.x = this.initialX;
            }

            update() {
                this.y -= this.speed;
                this.angle += this.angleSpeed;
                // Aplicación exacta de función seno para la oscilación horizontal
                this.x = this.initialX + Math.sin(this.angle) * this.amplitude;

                if (this.y < -50) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(this.size, this.size);
                ctx.fillStyle = this.color;
                
                // Dibujo vectorial de corazón
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(0, -5, -5, -15, -15, -15);
                ctx.bezierCurveTo(-25, -15, -25, -2.5, -25, -2.5);
                ctx.bezierCurveTo(-25, 10, -10, 20, 0, 30);
                ctx.bezierCurveTo(10, 20, 25, 10, 25, -2.5);
                ctx.bezierCurveTo(25, -2.5, 25, -15, 15, -15);
                ctx.bezierCurveTo(5, -15, 0, -5, 0, 0);
                
                ctx.fill();
                ctx.restore();
            }
        }

        // Crear corazones flotantes
        const numHearts = Math.min(Math.floor(window.innerWidth / 15), 40);
        for (let i = 0; i < numHearts; i++) {
            hearts.push(new Heart());
        }

        function animateHearts() {
            ctx.clearRect(0, 0, width, height);
            hearts.forEach(heart => {
                heart.update();
                heart.draw();
            });
            requestAnimationFrame(animateHearts);
        }
        
        animateHearts();

        // --- LÓGICA DE INTERACCIÓN DE LOS BOTONES ---
        let no_clicks = 0;
        let retracted = false;
        let confirmScale = 1.0;

        const mainScreen = document.getElementById('main-screen');
        const successScreen = document.getElementById('success-screen');
        const btnNo = document.getElementById('no-btn');
        const btnYes = document.getElementById('yes-btn');
        
        const modal1 = document.getElementById('modal-1');
        const modal2 = document.getElementById('modal-2');
        
        const btnRetract = document.getElementById('retract-btn');
        const btnConfirm = document.getElementById('confirm-btn');
        const btnCloseModal2 = document.getElementById('close-modal-2');
        const btnCloseSuccess = document.getElementById('close-success-btn');

        // Mover el botón NO de forma aleatoria
        function moveNoButton() {
            btnNo.style.position = 'fixed';
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            const btnWidth = btnNo.offsetWidth;
            const btnHeight = btnNo.offsetHeight;
            
            const maxX = windowWidth - btnWidth - 20;
            const maxY = windowHeight - btnHeight - 20;
            const randomX = Math.max(20, Math.floor(Math.random() * maxX));
            const randomY = Math.max(20, Math.floor(Math.random() * maxY));
            
            btnNo.style.left = `${randomX}px`;
            btnNo.style.top = `${randomY}px`;
        }

        function resetNoButton() {
            btnNo.style.position = 'static';
            btnNo.style.left = 'auto';
            btnNo.style.top = 'auto';
        }

        // Evento botón NO
        btnNo.addEventListener('click', (e) => {
            e.preventDefault(); 

            if (retracted) {
                modal2.classList.remove('hidden');
                return;
            }

            no_clicks++;

            if (no_clicks >= 1 && no_clicks <= 3) {
                moveNoButton();
            } else if (no_clicks === 4) {
                resetNoButton();
            } else if (no_clicks >= 5) {
                modal1.classList.remove('hidden');
            }
        });

        // Evento botón SÍ (Pantalla final con el gato)
        btnYes.addEventListener('click', () => {
            mainScreen.classList.add('fade-out');
            setTimeout(() => {
                mainScreen.classList.add('hidden');
                mainScreen.classList.remove('fade-out');
                
                successScreen.classList.remove('hidden');
                successScreen.classList.add('flex', 'modal-enter');
            }, 400);
        });

        // Botón Retractarse en Modal 1
        btnRetract.addEventListener('click', () => {
            modal1.classList.add('hidden');
            retracted = true; 
        });

        // Botón Confirmar en Modal 1 (Se reduce 25% por clic hasta desaparecer)
        btnConfirm.addEventListener('click', () => {
            confirmScale -= 0.25;
            
            if (confirmScale <= 0) {
                btnConfirm.style.transform = `scale(0)`;
                setTimeout(() => {
                    btnConfirm.style.display = 'none';
                }, 200); 
            } else {
                btnConfirm.style.transform = `scale(${confirmScale})`;
            }
        });

        // Cerrar Alerta de intentos agotados
        btnCloseModal2.addEventListener('click', () => {
            modal2.classList.add('hidden');
        });
        
        // Botón 'X' para reiniciar todo desde la pantalla del gato
        btnCloseSuccess.addEventListener('click', () => {
            successScreen.classList.add('hidden');
            successScreen.classList.remove('flex', 'modal-enter');
            
            no_clicks = 0;
            retracted = false;
            confirmScale = 1.0; 
            
            resetNoButton();
            
            btnConfirm.style.transform = 'scale(1)';
            btnConfirm.style.display = 'block';
            
            mainScreen.classList.remove('hidden');
        });
    </script>
</body>
</html>
